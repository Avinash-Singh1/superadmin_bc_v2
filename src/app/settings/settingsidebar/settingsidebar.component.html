<div class="sidenavdata">
  <ul class="navbar-nav" *ngFor="let item of items">
    <li
      class="nav-item"
      routerLink="{{ item.route }}"
      routerLinkActive="active"
      [ngClass]="{ active: checkCurrentRoute(item.route) }"
    >
      <span class="nav-item__label">{{ item?.list }}</span>
      <span class="nav-item__arrow" aria-hidden="true">›</span>
    </li>
  </ul>
</div>
