<section class="settings-page password-page">
    <header class="settings-page__header">
        <div>
            <span class="settings-page__eyebrow">Account security</span>
            <h2>Password</h2>
            <p>Choose a strong password to keep your administrator account secure.</p>
        </div>
    </header>

    <form class="password-form" [formGroup]="updatePasswordFrom" (ngSubmit)="changePassword()">
        <div class="form-field">
            <label for="oldPassword">Current password</label>
            <input id="oldPassword" type="password" class="form-control" placeholder="Enter current password" autocomplete="current-password" formControlName="oldPassword">
            <span *ngIf="submitted && control.oldPassword?.errors?.required" class="field-error">Current password is required</span>
        </div>

        <div class="form-field">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" class="form-control" placeholder="Enter new password" autocomplete="new-password" formControlName="newPassword">
            <span *ngIf="submitted && control.newPassword?.errors?.required" class="field-error">New password is required</span>
        </div>

        <div class="form-field">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" class="form-control" placeholder="Re-enter new password" autocomplete="new-password" formControlName="confirmPassword">
            <span *ngIf="submitted && control.confirmPassword?.errors?.required" class="field-error">Please confirm the new password</span>
        </div>

        <div class="password-form__footer">
            <button class="save-password" type="submit">Update password</button>
        </div>
    </form>
</section>
