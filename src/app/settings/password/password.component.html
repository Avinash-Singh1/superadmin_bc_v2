<div class="profile">
    <div class="contentHeader mt-4">
        <span class="profileHeader">Password</span>
    </div>
    <hr>
    <form class="mt-5 ps-4 profileForm" [formGroup]="updatePasswordFrom" (ngSubmit)="changePassword()">
        <div class="d-flex flex-column">
            <label class="profileDetail ">Old Password</label>
            <input type="text" class=" mt-2 form-control inputHeight" placeholder="Old Password" formControlName="oldPassword">
        </div>
        <div *ngIf="submitted && control.oldPassword?.errors?.required"  class="emailerror">Old Password is required</div>
        <div class="d-flex flex-column mt-3">
            <label class="profileDetail">New Password</label>
            <input type="email" class=" mt-2 form-control inputHeight" placeholder="New Password" formControlName="newPassword">
        </div>
        <div *ngIf="submitted && control.newPassword?.errors?.required"  class="emailerror">New Password is required</div>
        <div class="d-flex flex-column mt-3">
            <label class="profileDetail">Confirm Password</label>
            <input type="email" class=" mt-2 form-control inputHeight" placeholder="Confirm Pasword" formControlName="confirmPassword">
        </div>
        <div *ngIf="submitted && control.confirmPassword?.errors?.required"  class="emailerror">Confirm Password is required</div>
        <button class="saveProfile mt-4 " type="submit">Reset Password</button>

    </form>

</div>
