<app-header></app-header>

<div class="patientsHeader d-flex justify-content-between align-items-center">
  <h2 class="page-title">Sync Sitemap</h2>
</div>

<div class="sitemap-card">
  <div class="card-body text-center">
    <p class="description">
      Click the button below to regenerate the sitemap for <b>nectarplus.health</b>.
    </p>

    <button (click)="syncSitemap()" [disabled]="loading" class="btn btn-primary btn-lg">
      <i class="bi bi-arrow-repeat me-2"></i>
      {{ loading ? 'Syncing...' : 'Sync Sitemap' }}
    </button>

    <!-- Progress bar while loading -->
    <div *ngIf="loading" class="progress-container mt-4">
      <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated w-100"></div>
      </div>
      <p class="mt-2 text-muted">Syncing Sitemap... Please wait</p>
    </div>

    <!-- Success / Error message -->
    <div *ngIf="!loading && message" class="mt-3">
      <p [ngClass]="{ 'text-success': message.includes('success'), 'text-danger': message.includes('Failed') }">
        {{ message }}
      </p>
    </div>
  </div>
</div>
