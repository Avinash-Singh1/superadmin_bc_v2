<div class="google-map">
  <agm-map
    [latitude]="lat"
    [longitude]="lng"
    [mapTypeId]="mapType"
    [zoom]="zoom"
    [disableDefaultUI]="true"
    (mapReady)="onMapReady($event)"
  >
    <agm-marker
      [latitude]="lat"
      [longitude]="lng"
      animation="DROP"
      [markerDraggable]="markerDragable"
      (dragEnd)="markerDragEnd($event)"
    >
    </agm-marker>
  </agm-map>
</div>
