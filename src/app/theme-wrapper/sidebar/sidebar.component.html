<aside class="sidebar" [class.collapsed]="!toggle">
  <!-- Brand -->
  <div class="sidebar-brand">
    <!-- <svg-icon src="assets/images/svg/nectar-logo.svg" class="brand-logo"></svg-icon> -->
     <img src="" alt="">
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <ng-container *ngFor="let item of menuList; let i = index">
        <!-- Regular nav item (no dropdown) -->
        <li
          class="nav-item"
          *ngIf="!item?.dropdown"
          routerLink="{{ item.routerLink }}"
          routerLinkActive="active"
        >
          <div class="nav-link">
            <span class="nav-icon">
              <svg-icon [src]="item.icon"></svg-icon>
            </span>
            <span class="nav-label">{{ item.label | translate }}</span>
          </div>
        </li>

        <!-- Dropdown nav item -->
        <li
          class="nav-item has-dropdown"
          *ngIf="item?.dropdown"
          [class.open]="item?.collapse"
        >
          <div class="nav-link" (click)="item.collapse = !item?.collapse">
            <span class="nav-icon">
              <svg-icon [src]="item.icon"></svg-icon>
            </span>
            <span class="nav-label">{{ item.label | translate }}</span>
            <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>

          <!-- Sub-items -->
          <ul class="sub-list" *ngIf="item?.collapse">
            <li
              class="sub-item"
              *ngFor="let subItem of item?.list"
              routerLink="{{ subItem.routerLink }}"
              routerLinkActive="active"
              [relativeTo]="activatedRoute"
            >
              <div class="sub-link">
                <span class="sub-dot"></span>
                <span class="sub-label">{{ subItem.label | translate }}</span>
              </div>
            </li>
          </ul>
        </li>
      </ng-container>
    </ul>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="footer-divider"></div>
    <div class="nav-item logout-item" (click)="logout()">
      <div class="nav-link">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </span>
        <span class="nav-label logout-label">{{ "LOG_OUT" | translate }}</span>
      </div>
    </div>
  </div>
</aside>
