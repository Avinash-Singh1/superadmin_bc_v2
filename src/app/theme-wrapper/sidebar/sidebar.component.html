<div class="sidenavdata sidenav" [ngClass]="{ 'no-header': !toggle }">
  <div>
    <div class="ps-4">
      <svg-icon src="assets/images/svg/nectar-logo.svg"></svg-icon>
    </div>
    <nav class="navbar-expand-lg mt-3">
      <div class="">
        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
          <ul class="navbar-nav flex-column w-100">
            <ng-container *ngFor="let item of menuList; let i = index">
              <li
                class="nav-item d-flex flex-row align-items-center justify-content-between px-4"
                routerLink="{{ item.routerLink }}"
                routerLinkActive="active"
                *ngIf="!item?.dropdown"
              >
                <!-- [relativeTo]="activatedRoute" -->
                <a
                  class="nav-link d-flex w-100"
                  aria-current="page"
                  (click)="(item?.collapse != item?.collapse)"
                >
                  <svg-icon [src]="item.icon" class="listimg me-2"> </svg-icon>
                  <span class="activelink ms-2">{{
                    item.label | translate
                  }}</span>
                </a>
              </li>
              <li
                class="nav-item d-flex flex-row align-items-center justify-content-between px-4"
                *ngIf="item?.dropdown"
                (click)="item.collapse = !item?.collapse"
              >
                <a class="nav-link d-flex w-100" aria-current="page">
                  <svg-icon
                    class="listimg me-2"
                    width="24px"
                    height="24px"
                    [src]="item.icon"
                    alt=""
                  ></svg-icon>

                  <div
                    class="d-flex w-100 justify-content-between align-items-center"
                  >
                    <span class="activelink ms-2">{{
                      item.label | translate
                    }}</span>
                    <img
                      [src]="item?.dropdownIcon"
                      alt=""
                      width="20px"
                      height="20px"
                      [ngClass]="{ 'rotate-90': item?.collapse }"
                    />
                  </div>
                </a>
              </li>

              <div class="d-flex flex-column" *ngIf="!item?.collapse">
                <ng-container *ngFor="let subItem of item?.list; let i = index">
                  <li
                    class="nav-item d-flex flex-row align-items-center justify-content-between ps-5"
                    routerLink="{{ subItem.routerLink }}"
                    routerLinkActive="active"
                    [relativeTo]="activatedRoute"
                  >
                    <a class="nav-link d-flex w-100" aria-current="page">
                      <svg-icon
                        class="listimg me-2"
                        width="24px"
                        height="24px"
                        [src]="subItem.icon"
                        alt=""
                      ></svg-icon>
                      <span class="activelink ms-2">{{
                        subItem.label | translate
                      }}</span>
                    </a>
                  </li>
                </ng-container>
              </div>
            </ng-container>
            <li
              class="nav-item d-flex flex-row align-items-center justify-content-between px-4"
              (click)="logout()"
            >
              <a class="nav-link d-flex w-100" aria-current="page">
                <img
                  class="listimg me-2"
                  width="24px"
                  height="24px"
                  src="assets/images/svg/logout-1.svg"
                  alt=""
                />
                <span class="logout-text ms-2">{{
                  "LOG_OUT" | translate
                }}</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</div>
