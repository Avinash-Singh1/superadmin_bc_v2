<form class="profile" [formGroup]="addFaqForm">
  <div class="contentHeader my-3">
    <span class="profileHeader">{{ header }} {{ faq }}</span>
  </div>
  <hr />
  <div class="">
    <div class="text-center" *ngIf="faq == 'Speciality'">
      <!-- <span class="profilePhotoHeader"> Profile Photo</span> -->
      <div class="">
        <img class="image-container" [src]="f['profilePic'].value" alt="" />
        <label for="file-ip-1" class="cursor chnagePhoto ms-3"
          >upload Image</label
        >
        <input
          class="form-control uploadImage"
          id="file-ip-1"
          type="file"
          (change)="onChange($event)"
          formControlName="profilePic"
        />
        <div
          *ngIf="submitted && f.profilePic?.errors?.required"
          class="emailerror"
        >
          Please upload image
        </div>
      </div>
    </div>
    <div class="mx-4 mt-3 d-flex flex-column">
      <label class="profileDetail"
        >{{ faq }}<span class="mandatory">*</span></label
      >
      <input
        type="text"
        class="mt-2 form-control inputHeight"
        [placeholder]="faq"
        formControlName="question"
      />
      <div
        *ngIf="submitted && f?.question?.errors?.required"
        class="emailerror mt-2"
      >
        {{ faq }} is required
      </div>
    </div>
    <div class="mx-4 mt-3">
      <label>Description</label>
      <div class="NgxEditor__Wrapper mt-2">
        <ngx-editor-menu
          [editor]="editor"
          [toolbar]="toolbar"
          >
          <!-- [customMenuRef]="customMenu" -->
        </ngx-editor-menu>
        <!-- <ng-template #customMenu> </ng-template> -->
        <ngx-editor
          [editor]="editor"
          formControlName="description"
          [placeholder]="'Type description'"
        >
        </ngx-editor>
      </div>
    </div>

    <div class="mx-4 mt-3">
      <label>Links</label>
      <div class="NgxEditor__Wrapper mt-2">
        <ngx-editor-menu
          [editor]="editor1"
          [toolbar]="toolbar"
          >
          <!-- [customMenuRef]="customMenu" -->
        </ngx-editor-menu>
        <!-- <ng-template #customMenu> </ng-template> -->
        <ngx-editor
          [editor]="editor1"
          formControlName="links"
          [placeholder]="'Type link'"
        >
        </ngx-editor>
      </div>
    </div>

    <div class="m-4 add">
      <!-- <img class="cursor" src="assets/images/svg/deletedata.svg" alt="" *ngIf="header=='Edit'" (click)="deleteFaq()"> -->
      <div class="mt-3 d-flex justify-content-end">
        <button class="cancel me-1" type="button" (click)="closeModal()">
          Cancel
        </button>
        <button class="save ms-3" type="submit" (click)="addEditdata()">
          Save
        </button>
      </div>
    </div>
  </div>
</form>
