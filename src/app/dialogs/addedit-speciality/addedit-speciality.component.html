<form class="profile" [formGroup]="addFaqForm">
  <div class="contentHeader my-3">
    <span class="profileHeader">{{ header }} {{ faq }}</span>
  </div>
  <hr />

  <div class="text-center" *ngIf="faq == 'Speciality'">
    <div>
      <img class="image-container" [src]="addFaqForm.get('profilePic')?.value" alt="" />
      <label for="file-ip-1" class="cursor chnagePhoto ms-3">Upload Image</label>
      <input
        class="form-control uploadImage"
        id="file-ip-1"
        type="file"
        (change)="onChange($event)"
        formControlName="profilePic"
      />
      <div *ngIf="submitted && addFaqForm.get('profilePic')?.errors?.['required']" class="emailerror">
        Please upload an image
      </div>
    </div>
  </div>

  <div class="mx-4 mt-3 d-flex flex-column">
    <label class="profileDetail">{{ faq }}<span class="mandatory">*</span></label>
    <input
      type="text"
      class="mt-2 form-control inputHeight"
      [placeholder]="faq"
      formControlName="question"
    />
    <div *ngIf="submitted && addFaqForm.get('question')?.errors?.['required']" class="emailerror mt-2">
      {{ faq }} is required
    </div>
  </div>

  <div class="mx-4 mt-3">
    <label>Description</label>
    <div class="NgxEditor__Wrapper mt-2">
      <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"></ngx-editor-menu>
      <ngx-editor [editor]="editor" formControlName="description" placeholder="Type description"></ngx-editor>
    </div>
  </div>

  <div class="mx-4 mt-3">
    <label>Links</label>
    <div class="NgxEditor__Wrapper mt-2">
      <ngx-editor-menu [editor]="editor1" [toolbar]="toolbar"></ngx-editor-menu>
      <ngx-editor [editor]="editor1" formControlName="links" placeholder="Type link"></ngx-editor>
    </div>
  </div>

  <!-- Dynamic Sections -->
 <!-- Dynamic Sections -->
<div *ngFor="let section of additionalSections; let i = index" class="mx-4 mt-3">
  
  <!-- Ensure title updates correctly -->
  <input 
    type="text" 
    class="form-control inputHeight" 
    placeholder="Section Title"
    [value]="section.title" 
    (input)="updateTitle($event, i)" 
  />

  <div class="NgxEditor__Wrapper mt-2">
    <ngx-editor-menu [editor]="section.editor" [toolbar]="toolbar"></ngx-editor-menu>
    <ngx-editor 
      [editor]="section.editor" 
      (contentChanged)="updateContent($event, i)"
      placeholder="Type content">
    </ngx-editor>
  </div>

  <button type="button" class="btn btn-sm btn-danger mt-2" (click)="deleteSection(i)">Delete</button>
  <hr />
</div>


 
    
<div class="mt-4 d-flex justify-content-end gap-3 m-2">
  <button type="button" class="btn btn-primary" (click)="addSection()">+ Add Section</button>
  <button class="btn btn-outline-secondary" type="button" (click)="closeModal()">Cancel</button>
  <button class="btn btn-success" type="submit" (click)="addEditdata()">Save</button>
</div>


  
</form>
