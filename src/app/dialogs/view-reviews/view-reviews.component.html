<div class="icon-close py-3 px-4 d-flex justify-content-between">
    <span class="viewHeader">View</span>
    <img class="cursor" src="assets/images/svg/close.svg" alt="" (click)="closeModal()">
</div>
<hr class="p-0 m-0">
<div class="profile-details d-flex align-items-center">
    <div class="image d-flex">
        <!-- <img src="../../../assets/images/svg/nectorIcon.svg" alt=""> -->
       
        <img class="patientimg" *ngIf="approvedViewDetail?.patientProfilePic!=null || approvedViewDetail?.patientProfilePic!=undefined ||  approvedViewDetail?.patientProfilePic; else intial" [src]="approvedViewDetail?.patientProfilePic" alt="" > 
        <ng-template #intial>
          <div class="imageintial ">
         {{approvedViewDetail?.name?.[0]?.[0] | uppercase}}{{approvedViewDetail?.name?.[1]?.[0] | uppercase}}
        </div>
        </ng-template>

    </div>
    <div class="details">
        <div class="d-flex  align-items-center">
        <h3 class="username m-0">
            {{approvedViewDetail?.doctorName}}
        </h3>
        <form [formGroup]="form" class="d-flex align-items-center ms-3 startRating">
            <p class="ratingNumber m-0 p-0">{{this.approvedViewDetail?.totalPoint}}</p>
          <div class="cont">
            <div class="stars">
              <!-- <ngx-star-rating formControlName="rating2" [id]="'rating2'"  [disabled] ="true"></ngx-star-rating> -->
              <star-rating [rating]="this.approvedViewDetail?.totalPoint|| 0"
              [step]="0.1"
              [showHalfStars]="true"
              [readOnly]="true"
  ></star-rating>
            </div>
          </div>
        </form>
    </div>
        <p class="occupation m-0" >{{approvedViewDetail?.feedback}}</p>
    </div>
    
</div>
<div class="hospitalDetail">
    <div class="row">
<div *ngFor="let data of userDetail" class="col-md-6  userdata mt-3 ms-3 p-0 ">
    <div class="d-flex  ps-3 pt-2"> 
        <img [src]="data?.img" alt="">
        <span class="ms-2 heading">{{data?.heading}}</span>
    </div>
    <hr>
    <div class="ps-3 pb-2 content" >
        {{data?.content || 'N/A'}}
    </div>
</div>
</div>
<div class="d-flex flex-wrap mt-4 ">
    <div class="goodReview mt-2" *ngFor="let review of approvedViewDetail?.doctorHappiness">{{review}}</div>
</div>
<div class="mt-3 recommendation d-flex align-items-center" *ngIf="approvedViewDetail?.doctorRecommend==true">
    <span>Recommend Doctor</span>
    <img class="ms-2" src="assets/images/svg/thumbsup.svg" alt="">
</div>
<div class="d-flex justify-content-end">
    <button class="cancel" (click)="closeModal()">Cancel</button>
    <button class="delete ms-2" (click)="DeleteReviewComponent()">Delete</button>
</div>
</div>
