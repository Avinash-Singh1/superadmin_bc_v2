<form class="profile" [formGroup]="addFaqForm" (ngSubmit)="addFaq()">
    <div class="contentHeader my-3">
        <span class="profileHeader">{{header}} {{FAQ}}</span>
    </div>
    <hr>
    <div class="m-4" *ngIf="FAQ=='FAQ'">
        <div class="d-flex flex-column">
            <label class="profileDetail ">Question</label>
            <!-- <textarea class=" mt-2 form-control inputHeight" placeholder="Question"></textarea> -->
            <input type="text" class=" mt-2 form-control inputHeight" placeholder="Question" formControlName="question" >
            <div *ngIf="submitted && f?.question?.errors?.required"  class="emailerror">Question is required</div>

        </div>
        <!-- <div *ngIf="submitted && control.oldPassword?.errors?.required"  class="emailerror">Old Password is required</div> -->
        <div class="d-flex flex-column mt-3">
            <label class="profileDetail">Answer</label>
            <!-- <textarea class=" mt-2 form-control inputHeight" placeholder="Answer"></textarea> -->
            <input type="email" class=" mt-2 form-control inputHeight" placeholder="Answer" formControlName="answer" >
            <div *ngIf="submitted && f?.answer?.errors?.required"  class="emailerror">Answer is required</div>

        </div>

    </div>
    <div class="m-4" *ngIf="FAQ=='Social'">
        <div class="d-flex flex-column">
            <label class="socialForm ">Social<span class="mandatory">*</span></label>
            <mat-select class=" mt-3 userDetail inputHeight  form-control" placeholder="Select Social" formControlName="question" maxlength="200">
                <mat-option  *ngFor="let data of socialValue" [value]="data?._id">
                  {{data?.name}}
                </mat-option>
              </mat-select>
              
                <div *ngIf="submitted && f?.question?.errors?.required"  class="emailerror">Social is required</div>
              


        </div>
        <!-- <div *ngIf="submitted && control.oldPassword?.errors?.required"  class="emailerror">Old Password is required</div> -->
        <div class="d-flex flex-column mt-3">
            <label class="socialForm">Social URL<span class="mandatory">*</span></label>
            <!-- <textarea class=" mt-2 form-control inputHeight" placeholder="Answer"></textarea> -->
            <input type="email" class=" mt-2 form-control inputHeight" placeholder="Type Social Url" formControlName="answer" maxlength="200">
            <div *ngIf="submitted && f?.answer?.errors?.required"  class="emailerror">Social URL is required</div>

        </div>

    </div>
    <hr>
    <div class="m-4" [ngClass]="header=='Edit'?'edit':'add'">
        <img class="cursor" src="assets/images/svg/deletedata.svg" alt="" *ngIf="header=='Edit'" (click)="deleteFaq()">
        <div class="d-flex justify-content-end ">
            <button class="cancel" (click)="closeModal()">Cancel</button>
            <button class="save ms-2" (click)="addFaq()">Save</button>
        </div>
    </div>
</form>
