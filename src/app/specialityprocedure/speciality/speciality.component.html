<div class="page-wrapper">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <div class="tab-switcher">
        <button class="tab-btn" [class.active]="doctorsList" (click)="chnageDoctorList('doctors')" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Speciality
          <span class="tab-count">{{ totalLength || '0' }}</span>
        </button>
        <button class="tab-btn" [class.active]="hospitalsList" (click)="chnageDoctorList('hospitals')" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Procedure
          <span class="tab-count">{{ totalLengthProcedure || '0' }}</span>
        </button>
      </div>
    </div>
    <div class="header-right">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" [formControl]="search" placeholder="Search by name..." />
      </div>
      <button class="add-btn" (click)="addEditSpeciaityProcedure(doctorsList ? 'Speciality' : 'Procedure', 'Add')" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add {{ doctorsList ? 'Speciality' : 'Procedure' }}
      </button>
    </div>
  </div>

  <!-- Speciality Table -->
  <div class="table-card" *ngIf="doctorsList">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="th-index">#</th>
            <th class="sortable" (click)="aseImage ? sortData('fullName','ASC','Specaility') : descImage ? sortData('fullName','DESC','Specaility') : sortData('fullName','nosort','Specaility')">
              Name
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
            </th>
            <th class="th-action">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let element of dataSource; let i = index">
            <td class="td-index">{{ i + 1 }}</td>
            <td class="td-name">
              <div class="name-cell">
                <div class="name-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </div>
                <span>{{ element?.name }}</span>
              </div>
            </td>
            <td class="td-action">
              <div class="action-group">
                <button class="edit-btn" (click)="addEditSpeciaityProcedure('Speciality','Edit',element?._id,element?.name,element?.image,element?.description,element?.links,element?.breadcrumb,element?.sections)" type="button">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Edit
                </button>
                <button class="delete-btn" (click)="deleteData(element?._id, 'Speciality')" type="button">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="table-footer" *ngIf="dataSource?.length">
      <span class="table-info">Showing {{ dataSource?.length }} of {{ totalLength }} specialities</span>
    </div>
    <div class="empty-state" *ngIf="totalLength == 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <p>No specialities found</p>
    </div>
  </div>

  <!-- Procedure Table -->
  <div class="table-card" *ngIf="hospitalsList">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="th-index">#</th>
            <th class="sortable" (click)="aseProcedure ? sortData('fullNameProcedure','ASC','Procedure') : descProcedure ? sortData('fullNameProcedure','DESC','Procedure') : sortData('fullNameProcedure','nosort','Procedure')">
              Name
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
            </th>
            <th class="th-action">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let element of dataSourceProcedure; let i = index">
            <td class="td-index">{{ i + 1 }}</td>
            <td class="td-name">
              <div class="name-cell">
                <div class="name-icon procedure">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <span>{{ element?.name }}</span>
              </div>
            </td>
            <td class="td-action">
              <div class="action-group">
                <button class="edit-btn" (click)="addEditSpeciaityProcedure('Procedure','Edit',element?._id,element?.name,'',element?.description,element?.links)" type="button">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Edit
                </button>
                <button class="delete-btn" (click)="deleteData(element?._id, 'Procedure')" type="button">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="table-footer" *ngIf="dataSourceProcedure?.length">
      <span class="table-info">Showing {{ dataSourceProcedure?.length }} of {{ totalLengthProcedure }} procedures</span>
    </div>
    <div class="empty-state" *ngIf="totalLengthProcedure == 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
      <p>No procedures found</p>
    </div>
  </div>
</div>
